<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snechat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06090c;
  --bg-2:#0a0f14;
  --surface:#10161c;
  --surface-2:#171f27;
  --border:#212b34;
  --cyan:#29e0ff;
  --blue:#4f8dff;
  --violet:#9b6bff;
  --text:#eef4f8;
  --muted:#7c8b99;
  --danger:#ff6b6b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
#app{position:relative;width:100%;height:100vh;height:100dvh;background:
  radial-gradient(ellipse 60% 40% at 20% 0%, rgba(79,141,255,.10), transparent 60%),
  radial-gradient(ellipse 50% 35% at 85% 10%, rgba(155,107,255,.09), transparent 60%),
  var(--bg);
  overflow:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;color:inherit;}

/* visually-hidden but reliably clickable file inputs */
.file-input-hidden{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;overflow:hidden;}

/* ---------- Boot / Cutscene ---------- */
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 24px;}
.logo-mark{width:46px;height:46px;position:relative;margin-bottom:26px;opacity:0;animation:markIn 1.2s ease forwards;}
.logo-mark svg{width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(41,224,255,.65));}
@keyframes markIn{to{opacity:1;}}
.cut-title{font-size:32px;font-weight:700;letter-spacing:1.5px;background:linear-gradient(90deg,var(--cyan),var(--blue) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transition:opacity 1.4s ease;text-align:center;}
.cut-sub{font-size:20px;letter-spacing:3px;color:var(--text);margin-top:10px;opacity:0;transition:opacity 1.4s ease;}
.cut-sub b{color:var(--cyan);}
.visible{opacity:1 !important;}

/* ---------- Auth / Model select ---------- */
.auth-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;animation:fadeUp .7s ease forwards;overflow-y:auto;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.auth-card{width:100%;max-width:380px;}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:30px;justify-content:center;}
.auth-logo svg{width:28px;height:28px;filter:drop-shadow(0 0 14px rgba(41,224,255,.55));}
.auth-logo span{font-size:20px;font-weight:700;letter-spacing:1px;}
.auth-title{font-size:22px;font-weight:600;text-align:center;margin-bottom:6px;}
.auth-desc{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;line-height:1.5;}
.field{margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:.3px;}
.field input,.field textarea{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:13.5px;color:var(--text);outline:none;transition:border-color .2s;}
.field textarea{resize:vertical;min-height:80px;}
.field input:focus,.field textarea:focus{border-color:var(--cyan);}
.btn-primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(90deg,var(--cyan),var(--blue));color:#04141c;font-weight:700;font-size:14px;margin-top:6px;transition:transform .15s, box-shadow .15s;box-shadow:0 6px 24px rgba(41,224,255,.16);}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{width:100%;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;margin-top:8px;}
.auth-foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:16px;}

.model-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.model-card{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;transition:border-color .2s, background .2s;position:relative;}
.model-card.sel{border-color:var(--cyan);background:linear-gradient(180deg, rgba(41,224,255,.08), rgba(41,224,255,.02));}
.model-card .mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;padding-right:22px;}
.model-card .mname{font-weight:700;font-size:13.5px;font-family:'Space Grotesk',sans-serif;}
.model-card .mtag{font-size:9.5px;padding:3px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted);letter-spacing:.4px;}
.model-card.sel .mtag{background:rgba(41,224,255,.15);color:var(--cyan);}
.model-card .mdesc{font-size:11.5px;color:var(--muted);line-height:1.45;}
.model-card .check{position:absolute;top:13px;right:13px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);}
.model-card.sel .check{border-color:var(--cyan);background:var(--cyan);}

/* ---------- Chat shell ---------- */
.chat-shell{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text);transition:background .15s;flex-shrink:0;}
.icon-btn:active{background:var(--surface);}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.topbar-title b{color:var(--text);font-weight:600;}
.new-chat-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text);}

.update-toast{margin:0 14px 4px;padding:11px 13px;border-radius:14px;background:linear-gradient(135deg, rgba(41,224,255,.14), rgba(155,107,255,.10));border:1px solid rgba(41,224,255,.25);display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;color:var(--text);flex-shrink:0;}
.update-toast b{color:var(--cyan);}
.update-toast .ux{margin-left:auto;color:var(--muted);flex-shrink:0;padding:2px;}

.messages{flex:1;overflow-y:auto;padding:4px 14px 8px;display:flex;flex-direction:column;}
.empty-center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 30px;text-align:center;}
.rotating-text{font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .5s ease;min-height:26px;}

.msg-row{display:flex;gap:8px;margin:9px 0;align-items:flex-start;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg-row.user{justify-content:flex-end;}
.mini-avatar{width:24px;height:24px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;background:linear-gradient(135deg,var(--cyan),var(--violet));}
.mini-avatar svg{width:13px;height:13px;}
.bubble{max-width:74%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
.msg-row.user .bubble{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-bottom-right-radius:5px;}
.msg-row.ai .bubble{background:transparent;border:none;padding:2px 0 0 0;max-width:88%;color:var(--text);}
.msg-row.ai .tag{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.3px;}
.msg-row.ai .tag .dot{width:4px;height:4px;border-radius:50%;background:var(--cyan);}
.bubble img.att{max-width:190px;border-radius:12px;margin-top:6px;display:block;}
.bubble .svgwrap{margin-top:6px;border-radius:14px;overflow:hidden;background:#fff;padding:10px;max-width:230px;}
.bubble .svgwrap svg{width:100%;height:auto;display:block;}
.bubble .filechip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);padding:7px 10px;border-radius:10px;margin-top:6px;font-size:12px;}
.msg-row.ai .filechip{background:var(--surface);border:1px solid var(--border);}

.thinking-row{display:flex;gap:8px;align-items:center;margin:9px 0;}
.thinking{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:7px;}
.think-dots{display:flex;gap:3px;}
.think-dots span{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:bounce 1.1s infinite ease-in-out;}
.think-dots span:nth-child(2){animation-delay:.15s;}
.think-dots span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ---------- Composer ---------- */
.composer-wrap{flex-shrink:0;padding:6px 12px 14px;}
.attach-row{display:flex;gap:8px;overflow-x:auto;padding:0 4px 8px;}
.attach-chip{position:relative;width:52px;height:52px;border-radius:11px;overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.attach-chip img{width:100%;height:100%;object-fit:cover;}
.attach-chip .rm{position:absolute;top:2px;right:2px;width:15px;height:15px;background:rgba(0,0,0,.65);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;}
.pending-flags{display:flex;gap:6px;padding:0 4px 8px;flex-wrap:wrap;}
.flag-chip{font-size:10.5px;padding:4px 9px;border-radius:20px;background:rgba(41,224,255,.12);color:var(--cyan);display:flex;align-items:center;gap:5px;}
.flag-chip svg{width:12px;height:12px;}
.flag-chip .x{opacity:.7;}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 9px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.composer-row{display:flex;align-items:center;gap:2px;}
.composer-row + .composer-row{margin-top:1px;}
.composer input[type=text]{flex:1;background:none;border:none;outline:none;font-size:14px;padding:7px 6px;color:var(--text);min-width:0;}
.composer input[type=text]::placeholder{color:var(--muted);}
.send-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,opacity .2s;}
.send-btn:active{transform:scale(.9);}
.send-btn.off{opacity:.35;}

/* ---------- Sheets / Modals ---------- */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40;backdrop-filter:blur(2px);}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-2);border:1px solid var(--border);border-bottom:none;border-radius:22px 22px 0 0;padding:8px 16px 24px;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:41;max-height:80vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:34px;height:4px;background:var(--border);border-radius:4px;margin:6px auto 14px;}
.sheet-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:12px;}
.feature-item{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:13px;transition:background .15s;}
.feature-item:active{background:var(--surface);}
.feature-icon{width:38px;height:38px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.feature-text b{display:block;font-size:13.5px;font-weight:600;}
.feature-text span{font-size:11px;color:var(--muted);}

/* Drawer */
.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:300px;background:var(--bg-2);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:41;display:flex;flex-direction:column;}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:18px 16px 12px;display:flex;align-items:center;gap:9px;}
.drawer-head span{font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:15.5px;}
.drawer-newchat{margin:4px 12px 8px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;}
.drawer-section-label{font-size:10.5px;color:var(--muted);letter-spacing:.6px;padding:12px 16px 5px;}
.history-list{overflow-y:auto;flex:1;padding:0 8px;max-height:26vh;}
.history-item{padding:10px 9px;border-radius:11px;font-size:13px;color:var(--text);display:flex;flex-direction:column;gap:2px;transition:background .15s;}
.history-item:active{background:var(--surface);}
.history-item.active{background:var(--surface-2);}
.history-item small{color:var(--muted);font-size:10.5px;}
.drawer-account{margin:8px 12px 14px;padding:12px;border-radius:13px;background:var(--surface);display:flex;align-items:center;gap:10px;border:1px solid var(--border);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#04141c;flex-shrink:0;}
.acc-name{font-size:13px;font-weight:600;}
.acc-sub{font-size:10.5px;color:var(--muted);}

.badge-mode{font-size:9.5px;padding:3px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted);}

.pill-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.pill{padding:8px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--muted);}
.pill.sel{background:rgba(41,224,255,.14);border-color:var(--cyan);color:var(--cyan);font-weight:600;}
.toast-copy{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:10px 16px;border-radius:20px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast-copy.show{opacity:1;}
</style>
</head>

<div id="app"></div>

<script>
(function(){
"use strict";

/* ===================== Storage helpers ===================== */
async function sGet(key, shared){
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ localStorage.setItem(key, value); return { key, value }; }
  catch(e){ return null; }
}

/* ===================== Backend config ===================== */

    system: 'Kamu adalah SNECHAT 0.10, mode berpikir dalam dari asisten AI buatan Gilang. Sebelum menjawab pertanyaan serius, pertimbangkan beberapa sudut pandang secara internal, periksa ulang logika, fakta, dan kemungkinan kesalahan, lalu berikan jawaban akhir yang matang, teliti, dan terstruktur. Jangan tampilkan proses berpikir mentah, cukup sajikan hasil akhirnya. ' + TONE_RULE + ' ' + IDENTITY_RULE + ' Gunakan Bahasa Indonesia natural kecuali pengguna memakai bahasa lain.'
  }
};

const ROTATING_PHRASES = [
  'Tanyakan apa saja, SNECHAT',
  'Mau bahas apa hari ini?',
  'Ide, tugas, atau sekadar ngobrol?',

  'Siap bantu kapan saja',
  'Mulai obrolan dengan SNECHAT',
  'Ada yang bisa dibantu?',
  'Tulis apa saja, aku dengarkan'
];

/* ===================== Icons ===================== */
const ICONS = {
  logo: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 20 L3 20 Z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="3" y1="20" x2="21" y2="2"><stop offset="0%" stop-color="#29e0ff"/><stop offset="100%" stop-color="#9b6bff"/></linearGradient></defs></svg>`,

  chat: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.34A9 9 0 1 1 21 11.5z"/><circle cx="9" cy="12" r=".6" fill="currentColor"/><circle cx="13" cy="12" r=".6" fill="currentColor"/><circle cx="17" cy="12" r=".6" fill="currentColor"/></svg>`,
  send: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12 L20 4 L14 20 L11 13 Z" fill="#04141c"/></svg>`,
  image: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="cu
